
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      color: transparent;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #818cf8;
      transform: scale(1.05);
    }

    footer {
      margin-top: 60px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome!</h1>

    <p>
      This is my first website hosted on
      Cloudflare Pages. Thanks for visiting!
    </p>

    <button onclick="sayHello()">
      Click Me!
    </button>

    <footer>
      © 2026 My First Website
    </footer>
  </div>

  <script>
    function sayHello() {
      alert("Hello! Thanks for visiting my website!");
    }
  </script>

</body>
</html>
